include elves.cfg
# Tweaked for dellj
# Required Global Configurations
cpu_model_flags = ",+svm,+x2apic"
#cpu_model = "EPYC-v4"
#cpu_model = "host"
avocado_vt_repo="https://github.com/bssrikanth/avocado-vt.git"
avocado_vt_repo_branch="upstream0824"
#avocado_repo_branch="98.0"
test_timeout=30000
avocado_guest_reinstall=yes
start_vm = yes
usb_controller = xhci
usb_type = qemu-xhci
usb_type_usb1 = qemu-xhci
# --- Platform ---
# --- Block devices ---
# --- Net devices ---
# --- Misc ---
virtio_dev_iommu_platform=on
virtio_dev_disable_legacy=on
bridge=virbr0
vm_create_timeout = 120
kill_timeout=120
login_timeout=120
machine_type_extra_params = "kernel_irqchip=split"
only 24.04-server.x86_64
kernel = build_home/usr/local/bzImage
main_vm = vm1
#Test
variants:
    - qemu_sanity:
       variants:
            - shutdown:
                only io-github-autotest-qemu.shutdown
                shutdown_count=10
                no multivm
                no virtioscsi
            - reboot:
                only io-github-autotest-qemu.reboot
                reboot_count=25
                no virtioscsi
                only ovmfcodevars
            - nestedvm:
                only boot
                nested_guest_max_level=2
                vt_guest_image=20.04-server.x86_64
                vt_guest_image_L2=20.04-server.x86_64
                vt_type="qemu"
                nested_kvm_module="kvm_amd"
                run_nested_guest_test=yes
                nested_pycompat="python3"
                avocado_guest_reinstall=yes
                nested_guest_timeout=30000
                no virtioscsi,multivm,maxconfig
                only ovmfcodevars
variants:
    - virtioblk:
       only virtio_blk
       no virtio_scsi
       kernel_params='root=/dev/vda1 rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node'
    - virtioscsi:
       kernel_params='root=/dev/sda1 rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node'
variants:
    - maxconfig:
       vms = vm1
       mem = 245760
       smp = 288
       vcpu_cores = 72
       vcpu_threads = 2
       vcpu_sockets = 2
    - multivm:
       mem = 18432
       smp = 288
       vcpu_cores = 72
       vcpu_threads = 2
       vcpu_sockets = 2
       vms = vm1 vm2 vm3 vm4 vm5 vm6 vm7 vm8 vm9 vm10 vm11 vm12 vm13 vm14 vm15 vm16 vm17 vm18 vm19 vm20 vm21 vm22 vm23 vm24 vm25
       sysprep_required = yes
       master_images_clone = image1
       clone_master = yes
       remove_image_image1 = yes
    - min_config:
       vms = vm1
       mem = 24000
       smp = 1
       vcpu_cores = 1
       vcpu_threads = 1
       vcpu_sockets = 1
variants:
    - OvmfX64:
       variants:
            - ovmf:
                extra_params += " -drive if=pflash,format=raw,unit=0,file=build_home/usr/local/OvmfX64/OVMF.fd,readonly "
            - ovmfcodevars:
                ovmf_path = build_home/usr/local/OvmfX64/
                ovmf_code_filename = OVMF_CODE.fd
                ovmf_vars_filename = OVMF_VARS.fd
                restore_ovmf_vars = yes
    - Ovmf3264:
       variants:
            - ovmf:
                extra_params += " -drive if=pflash,format=raw,unit=0,file=build_home/usr/local/Ovmf3264/OVMF.fd,readonly "
            - ovmfcodevars:
                ovmf_path = build_home/usr/local/Ovmf3264/
                ovmf_code_filename = OVMF_CODE.fd
                ovmf_vars_filename = OVMF_VARS.fd
                restore_ovmf_vars = yes
