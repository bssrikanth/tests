include elves.cfg
# Tweaked for dellj
# Required Global Configurations
cpu_model = "EPYC-v4"
#cpu_model = "host"
auto_cpu_model = "no"
#cpu_model_flags = ",+svm,+x2apic"
avocado_vt_repo="https://github.com/bssrikanth/avocado-vt.git"
avocado_vt_repo_branch="upstream0824"
test_timeout=30000
avocado_guest_reinstall=yes
start_vm = yes
usb_controller = xhci
usb_type = qemu-xhci
usb_type_usb1 = qemu-xhci
# --- Platform ---
# --- Block devices ---
# --- Net devices ---
# --- Misc ---
virtio_dev_iommu_platform=on
virtio_dev_disable_legacy=on
bridge=virbr0
#machine_type_extra_params = "confidential-guest-support=sev0"
#extra_params=" -object sev-snp-guest,id=sev0,cbitpos=51,reduced-phys-bits=1,discard=both"
reboot_method=
vm_secure_guest_type = snp
vm_sev_cbitpos = 51
vm_sev_reduced_phys_bits = 1
vm_mem_backend = memory-backend-memfd
kill_timeout=720
login_timeout=720
vm_sev_kernel_hashes = on 
smp = 1
shutdown_count=1
vcpu_cores = 1
vcpu_threads = 1
vcpu_sockets = 1
mem = 2048M
#Test
only 24.04-server.x86_64
variants:
    - qemu_sanity:
       variants:
            - boot:
                only io-github-autotest-qemu.boot
                vms = vm1
                no min_config
variants:
    - kernelboot:
       kernel=build_home/usr/local/bzImage
       only virtio_blk
       no virtio_scsi
       kernel_params='root=/dev/vda1 rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node swiotlb=65536'
variants:
    - max_config:
       mem = 196608
       smp = 255
       vcpu_cores = 255
       vcpu_threads = 1
       vcpu_sockets = 1
       kill_timeout= 720
       login_timeout= 720
    - min_config:
       mem = 23808
       smp = 1
       vcpu_cores = 1
       vcpu_threads = 1
       vcpu_sockets = 1
       vm_create_timeout = 120
       kill_timeout= 120
       login_timeout= 120
variants:
    - default:
    - with_host_phys:
       cpu_model_flags = ",host-phys-bits=true"
variants:
    - AmdSev:
       bios_path = build_home/usr/local/AmdSev/OVMF.fd
