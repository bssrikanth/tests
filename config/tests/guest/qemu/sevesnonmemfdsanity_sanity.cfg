include elves.cfg
# Tweaked for dellj
# Required Global Configurations
cpu_model = "EPYC-v4"
#cpu_model = "host"
auto_cpu_model = "no"
#cpu_model_flags = ",+svm,+x2apic"
avocado_vt_repo="https://github.com/bssrikanth/avocado-vt.git"
avocado_vt_repo_branch="upstream0824"
test_timeout=30000
avocado_guest_reinstall=yes
start_vm = yes
usb_controller = xhci
usb_type = qemu-xhci
usb_type_usb1 = qemu-xhci
# --- Platform ---
# --- Block devices ---
# --- Net devices ---
# --- Misc ---
virtio_dev_iommu_platform=on
virtio_dev_disable_legacy=on
bridge=virbr0
kill_timeout=720
login_timeout=720
reboot_method=
#machine_type_extra_params = "confidential-guest-support=sev0"
vm_secure_guest_type = sev
vm_sev_cbitpos = 51
vm_sev_reduced_phys_bits = 1
vm_sev_policy = 7
only 24.04-server.x86_64
qemu_binary = build_home/usr/local/bin/qemu-system-x86_64
qemu_dst_binary = build_home/usr/local/bin/qemu-system-x86_64
qemu_img_binary = build_home/usr/local/bin/qemu-img
qemu_io_binary = build_home/usr/local/bin/qemu-io
kernel = build_home/usr/local/bzImage
main_vm = vm1
#Test
variants:
    - qemu_sanity:
       variants:
            - shutdown:
                only io-github-autotest-qemu.shutdown
                shutdown_count=10
                no multivm
                no virtioscsi
                no Ovmf3264 #currently OVMF_Ia3264 has issues noted at https://confluence.amd.com/display/ALK/VT+UPM+issues+and+status
            - boot:
                only io-github-autotest-qemu.boot
                only multivm
                no virtioscsi
                no Ovmf3264
variants:
    - virtioblk:
       only virtio_blk
       no virtio_scsi
       kernel_params='root=/dev/vda1 rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node swiotlb=65536'
    - virtioscsi:
       kernel_params='root=/dev/sda1 rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node swiotlb=65536'
variants:
    - withkernelhash:
       #extra_params=" -object sev-guest,id=sev0,cbitpos=51,reduced-phys-bits=1,policy=5,kernel-hashes=on -no-reboot "
       #machine_type = "pc-q35-7.1"
       vm_sev_kernel_hashes = on
       only AmdSev
    - withoutkernelhash:
       #extra_params=" -object sev-guest,id=sev0,cbitpos=51,reduced-phys-bits=1,policy=5 -no-reboot "
       vm_sev_kernel_hashes = off
       no AmdSev
variants:
    - maxconfig:
       vms = vm1
       mem = 245760
       smp = 255
       vcpu_cores = 255
       vcpu_threads = 1
       vcpu_sockets = 1
    - multivm:
       mem = 24576
       smp = 255
       vcpu_cores = 255
       vcpu_threads = 1
       vcpu_sockets = 1
       vms = vm1 vm2 vm3 vm4 vm5 vm6 vm7 vm8 vm9 vm10
       sysprep_required = yes
       master_images_clone = image1
       clone_master = yes
       remove_image_image1 = yes
    - min_config:
       vms = vm1
       mem = 2048
       smp = 1
       vcpu_cores = 1
       vcpu_threads = 1
       vcpu_sockets = 1
variants:
    - OvmfX64:
       variants:
            - ovmf:
                extra_params += " -drive if=pflash,format=raw,unit=0,file=build_home/usr/local/OvmfX64/OVMF.fd,readonly "
            - ovmfcodevars:
                ovmf_path = build_home/usr/local/OvmfX64/
                ovmf_code_filename = OVMF_CODE.fd
                ovmf_vars_filename = OVMF_VARS.fd
                restore_ovmf_vars = yes
    - Ovmf3264:
       variants:
            - ovmf:
                extra_params += " -drive if=pflash,format=raw,unit=0,file=build_home/usr/local/Ovmf3264/OVMF.fd,readonly "
            - ovmfcodevars:
                ovmf_path = build_home/usr/local/Ovmf3264/
                ovmf_code_filename = OVMF_CODE.fd
                ovmf_vars_filename = OVMF_VARS.fd
                restore_ovmf_vars = yes
    - AmdSev:
       variants:
            - ovmf:
                extra_params += " -drive if=pflash,format=raw,unit=0,file=build_home/usr/local/AmdSev/OVMF.fd,readonly "
