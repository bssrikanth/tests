include elves.cfg
# Tweaked for sharavati
# Required Global Configurations
cpu_model_flags = ",+svm,+x2apic"
avocado_vt_repo="https://github.com/bssrikanth/avocado-vt.git"
avocado_vt_repo_branch="upstream0824"
test_timeout=30000
avocado_guest_reinstall=yes
start_vm = yes
usb_controller = xhci
usb_type = qemu-xhci
usb_type_usb1 = qemu-xhci
# --- Platform ---
# --- Block devices ---
# --- Net devices ---
# --- Misc ---
restore_ovmf_vars=yes
virtio_dev_iommu_platform=on
virtio_dev_disable_legacy=on
bridge=virbr0
main_vm = vm1
vms = vm1
vm_create_timeout = 120
kill_timeout=120
login_timeout=120
ovmf_path = build_home/usr/local/OvmfX64/
ovmf_code_filename = OVMF_CODE.fd
ovmf_vars_filename = OVMF_VARS.fd
restore_ovmf_vars = yes
machine_type_extra_params = "kernel_irqchip=split"
kernel = build_home/usr/local/bzImage
only 26.04-server.x86_64
qemu_binary = build_home/usr/local/bin/qemu-system-x86_64
qemu_dst_binary = build_home/usr/local/bin/qemu-system-x86_64
qemu_img_binary = build_home/usr/local/bin/qemu-img
qemu_io_binary = build_home/usr/local/bin/qemu-io
#Test
variants:
    - qemu_sanity:
       variants:
            - shutdown:
                only io-github-autotest-qemu.shutdown
                shutdown_count=1
variants:
    - virtioblk:
       only virtio_blk
       no virtio_scsi
       kernel_params='root=/dev/vda1 rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node'
    - virtioscsi:
       only virtio_scsi
       no virtio_blk
       kernel_params='root=/dev/sda1 rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node'
variants:
    - max_config:
       mem = 179200
       smp = 288
       vcpu_cores = 72
       vcpu_threads = 2
       vcpu_sockets = 2
