include elves.cfg
# Tweaked for dellj
# Required Global Configurations
cpu_model = "EPYC-v4"
#cpu_model = "host"
auto_cpu_model = "no"
#cpu_model_flags = ",+svm,+x2apic"
avocado_vt_repo="https://github.com/bssrikanth/avocado-vt.git"
avocado_vt_repo_branch="upstream0824"
test_timeout=30000
avocado_guest_reinstall=yes
start_vm = yes
usb_controller = xhci
usb_type = qemu-xhci
usb_type_usb1 = qemu-xhci
# --- Platform ---
# --- Block devices ---
# --- Net devices ---
# --- Misc ---
virtio_dev_iommu_platform=on
virtio_dev_disable_legacy=on
bridge=virbr0
#machine_type_extra_params = "confidential-guest-support=sev0"
#extra_params=" -object sev-snp-guest,id=sev0,cbitpos=51,reduced-phys-bits=1,discard=both"
reboot_method=
vm_secure_guest_type = snp
vm_sev_cbitpos = 51
vm_sev_reduced_phys_bits = 1
vm_mem_backend = memory-backend-memfd
kill_timeout=720
login_timeout=720
vm_sev_kernel_hashes = off
bios_path = build_home/usr/local/OvmfX64/OVMF.fd
kernel = build_home/usr/local/bzImage
only 24.04-server.x86_64
qemu_binary = build_home/usr/local/bin/qemu-system-x86_64
qemu_dst_binary = build_home/usr/local/bin/qemu-system-x86_64
qemu_img_binary = build_home/usr/local/bin/qemu-img
qemu_io_binary = build_home/usr/local/bin/qemu-io
main_vm = vm1
#Test
variants:
    - qemu_sanity:
       variants:
            - shutdown:
                only io-github-autotest-qemu.shutdown
                no multivm
                only virtioblk
            - boot:
                only io-github-autotest-qemu.boot
                only virtioblk
            - snp_attestation:
                start_vm = no
                only virtioscsi
                only maxconfig
                auto_cpu_model = "no"
                cpu_model = host
                only io-github-autotest-qemu.snp_attestation.policy_default
            - kdump_test:
                only min_config
                only custom
                only virtio_scsi
                no virtio_blk
                auto_cpu_model = "no"
                cpu_model = host
                kdump_cfg_path="/etc/default/kdump-tools"
                vmcore_path = /var/crash/
                virtio_dev_iommu_platform = on
                virtio_dev_disable_legacy = on
                module_status = Y y 1
                shutdown_method = shell
                reboot_pattern_vm1 = "reboot: Restarting system"
                #Kernel parameters are intentionally left blank to override global settings
                kernel =
                kernel_params =
                secure_guest_type_vm1 = "snp"
                only io-github-autotest-qemu.kdump.one_vm.basic.sev_snp.default
variants:
    - custom:
    - virtioblk:
       only virtio_blk
       no virtio_scsi
       kernel_params='root=/dev/vda1 rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node swiotlb=65536'
    - virtioscsi:
       only virtio_scsi
       no virtio_blk
       kernel_params='root=/dev/sda1 rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node swiotlb=65536'
variants:
    - maxconfig:
       shutdown_count=2
       vms = vm1
       smp = 255
       vcpu_cores = 255
       vcpu_threads = 1
       vcpu_sockets = 1
       mem = 179200M
    - multivm:
       smp = 255
       vcpu_cores = 255
       vcpu_threads = 1
       vcpu_sockets = 1
       vms = vm1 vm2 vm3 vm4 vm5
       shutdown_count=2
       sysprep_required = yes
       master_images_clone = image1
       clone_master = yes
       remove_image_image1 = yes
       mem = 17920M
    - min_config:
       smp = 1
       vms = vm1
       shutdown_count=10
       vcpu_cores = 1
       vcpu_threads = 1
       vcpu_sockets = 1
       mem = 2048M
