include elves.cfg
# Tweaked for dellj
# Required Global Configurations
cpu_model_flags = ",+svm,+x2apic"
#cpu_model = "EPYC-v4"
#cpu_model = "host"
avocado_vt_repo="https://github.com/bssrikanth/avocado-vt.git"
avocado_vt_repo_branch="upstream0824"
test_timeout=30000
avocado_guest_reinstall=yes
start_vm = yes
usb_controller = xhci
usb_type = qemu-xhci
usb_type_usb1 = qemu-xhci
reboot_method=
# --- Platform ---
# --- Block devices ---
# --- Net devices ---
# --- Misc ---
virtio_dev_iommu_platform=on
virtio_dev_disable_legacy=on
bridge=virbr0
backup_image_before_test=yes
kill_timeout=720
login_timeout=720
reboot_method=
vm_secure_guest_type = sev
vm_sev_cbitpos = 51
vm_sev_reduced_phys_bits = 1
vm_sev_policy = 7
only 24.04-server.x86_64
kernel = build_home/usr/local/bzImage
main_vm = vm1
#Test
variants:
    - qemu_sanity:
       variants:
            - shutdown:
                only io-github-autotest-qemu.shutdown
                shutdown_count=10
                no multivm
                no virtioscsi
            - boot:
                only io-github-autotest-qemu.boot
                only multivm
                no virtioscsi
#            - transhuge:
#               only io-github-autotest-qemu.trans_hugepage
#               no trans_hugepage.relocated,trans_hugepage.migration,trans_hugepage.defrag,trans_hugepage.swapping
#               mem = 2048
#               no virtioscsi
#               no multivm
            - memhotplug:
               only hotplug_mem_simple
               guest_numa_nodes="node0"
               maxmem_mem=32G
               numa_memdev_node0=mem-mem0
               slots_mem=1
               mem_devs="mem0"
               mem=16384M
               mem_fixed=16384
               vm_mem_backend = memory-backend-memfd
               size_mem_plug1=8G
               stress_args='--cpu 12 --vm 20 --vm-bytes 1024M'
               stress_ng_args = "--page-in -r 4 -t 300s"
               stress_ng_args += ";--malloc 0 -t 300s"
               stress_ng_args += ";--mmap 0 -t 300s"
               stress_ng_args += ";--cpu 0 -l 95 --vm 0 --vm-bytes 80% --iomix 0 --iomix-bytes 80% --memcpy 2 --cache-prefetch -t 300s"
               no multivm
               no virtioscsi
               only ovmfcodevars
               no sevesmemfd #yet to be enabled
            - memhotplug_repeat:
               only hotplug_memory_repeat.repeat_256,hotplug_memory_repeat.scalability_test
               repeat_times=64
               no multivm
               no virtioscsi
               only ovmfcodevars
               no sevesmemfd #yet to be enabled
            - stressapptest:
                only io-github-autotest-qemu.linux_stress.stressapptest
                stress_shell_timeout = 1200
                stress_wait_for_timeout = 360
                stress_duration = 360
                stress_cmds_stressapptest = "stressapptest"
                make_cmds_stressapptest = "./configure && make && make install"
                uninstall_cmds_stressapptest = "./configure && make && make uninstall"
                download_url_stressapptest = "https://github.com/stressapptest/stressapptest.git"
                download_type_stressapptest = "git"
                stressapptest_args = "-M 6717 -s 360 -W -m 32"
                only ovmfcodevars
            - kernbench:
                only io-github-autotest-qemu.avocado_guest.kernbench
                avocadotestrepo=http://soslocalbuild.amd.com/git/avocado-misc-tests
                avocadomux=kernel/kernbench.py.data/kernbench_maxthread_5iterations.yaml
                avocadoinstalltype="pip"
                no multivm
                only ovmfcodevars
            - suspendresume:
                only qmp_command.qmp_cont,balloon_stop_continue
                no multivm
                no virtioscsi
                only ovmfcodevars
            - file_transfer:
                only io-github-autotest-qemu.file_transfer.default_setting
                no multivm
                only ovmfcodevars
            - net_jumbo:
                only io-github-autotest-qemu.jumbo
                no multivm
                no virtioblk
                only ovmfcodevars
            - qemu_img:
                only io-github-autotest-qemu.qemu_img.commit
                no multivm
                only ovmfcodevars
            - qemu_ioquit:
                only io-github-autotest-qemu.ioquit
                no multivm
                no virtioscsi
                only ovmfcodevars
variants:
    - virtioblk:
       only virtio_blk
       no virtio_scsi
       kernel_params='root=/dev/vda1 rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node swiotlb=65536'
    - virtioscsi:
       kernel_params='root=/dev/sda1 rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node swiotlb=65536'
variants:
    - sevesmemfd:
       vm_mem_backend = memory-backend-memfd
       variants:
            - withkernelhash:
                vm_sev_kernel_hashes = on 
                only AmdSev
            - withoutkernelhash:
                vm_sev_kernel_hashes = off
    - sevesnonmemfd:
       variants:
            - withkernelhash:
                vm_sev_kernel_hashes = on
                only AmdSev
            - withoutkernelhash:
                vm_sev_kernel_hashes = off 
variants:
    - maxconfig:
       vms = vm1
       mem = 484352
       smp = 255
       vcpu_cores = 255
       vcpu_threads = 1
       vcpu_sockets = 1
    - multivm:
       mem = 19200
       smp = 255
       vcpu_cores = 255
       vcpu_threads = 1
       vcpu_sockets = 1
       vms = vm1 vm2 vm3 vm4 vm5 vm6 vm7 vm8 vm9 vm10 vm11 vm12 vm13 vm14 vm15 vm16 vm17 vm18 vm19 vm20 vm21 vm22 vm23 vm24 vm25
       sysprep_required = yes
       master_images_clone = image1
       clone_master = yes
       remove_image_image1 = yes
    - min_config:
       vms = vm1
       mem = 24000
       smp = 1
       vcpu_cores = 1
       vcpu_threads = 1
       vcpu_sockets = 1
variants:
    - OvmfX64:
       variants:
            - ovmf:
                extra_params += " -drive if=pflash,format=raw,unit=0,file=build_home/usr/local/OvmfX64/OVMF.fd,readonly "
            - ovmfcodevars:
                ovmf_path = build_home/usr/local/OvmfX64/
                ovmf_code_filename = OVMF_CODE.fd
                ovmf_vars_filename = OVMF_VARS.fd
                restore_ovmf_vars = yes
    - AmdSev:
       variants:
            - ovmf:
                extra_params += " -drive if=pflash,format=raw,unit=0,file=build_home/usr/local/AmdSev/OVMF.fd,readonly "
