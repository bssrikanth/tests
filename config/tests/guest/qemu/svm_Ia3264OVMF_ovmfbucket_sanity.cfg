include elves.cfg
#cpu_model = "EPYC-v4"
#cpu_model = "host"
avocado_vt_repo="https://github.com/bssrikanth/avocado-vt.git"
avocado_vt_repo_branch="upstream0824"
test_timeout=24400
avocado_guest_reinstall=yes
start_vm = yes
usb_controller = xhci
usb_type = qemu-xhci
usb_type_usb1 = qemu-xhci
virtio_dev_iommu_platform=on
virtio_dev_disable_legacy=on
bridge=virbr0
main_vm = vm1
vm_create_timeout = 120
kill_timeout=120
login_timeout=120
machine_type_extra_params = "kernel-irqchip=split"
only 24.04-server.x86_64
variants:
    - qemu_sanity:
       variants:
            - boot:
                only io-github-autotest-qemu.boot
                vms = vm1
            - stress_boot_multivm:
                only io-github-autotest-qemu.boot
                vms="vm1 vm2 vm3 vm4 vm5 vm6 vm7 vm8 vm9 vm10"
                sysprep_required = yes
                only min_config
                master_images_clone = image1
                clone_master = yes
                remove_image_image1 = yes
                no with_host_phys
                only ovmfcodevars
            - shutdown:
                only io-github-autotest-qemu.shutdown
                vms = vm1
                shutdown_count=100
                no with_host_phys
                only ovmfcodevars
            - reboot:
                only io-github-autotest-qemu.reboot
                vms = vm1
                reboot_count=100
                no with_host_phys
                only ovmfcodevars
variants:
    - kernelboot:
       kernel=build_home/usr/local/bzImage
       only virtio_blk
       no virtio_scsi
       kernel_params='root=/dev/vda1 rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node swiotlb=65536'
    - fullboot:
       no virtio_blk
       only virtio_scsi
variants:
    - max_config:
       mem = 196608
       smp = 288
       vcpu_cores = 72
       vcpu_threads = 2
       vcpu_sockets = 2
    - min_config:
       mem = 23808
       smp = 1
       vcpu_cores = 1
       vcpu_threads = 1
       vcpu_sockets = 1
variants:
    - default:
    - with_host_phys:
       cpu_model_flags = ",host-phys-bits=true"
variants:
    - ovmf:
       extra_params += " -drive if=pflash,format=raw,unit=0,file=build_home/usr/local/Ovmf3264/OVMF.fd,readonly "
    - ovmfcodevars:
       ovmf_path = build_home/usr/local/Ovmf3264/
       ovmf_code_filename = OVMF_CODE.fd
       ovmf_vars_filename = OVMF_VARS.fd
       restore_ovmf_vars = yes
