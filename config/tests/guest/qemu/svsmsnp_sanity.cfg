include elves.cfg
# Required Global Configurations
avocado_vt_repo="https://github.com/bssrikanth/avocado-vt.git"
avocado_vt_repo_branch="upstream0824"
test_timeout=30000
avocado_guest_reinstall=yes
usb_controller = xhci
usb_type = qemu-xhci
usb_type_usb1 = qemu-xhci
virtio_dev_iommu_platform=on
virtio_dev_disable_legacy=on
bridge=virbr0
# Avocado sets MALLOC_PERTURB_=1 by default; with unfixed QEMU IGVM VP-context
# path that exposes a use-after-free, that poisons freed VMSA buffers. Until
# QEMU is rebuilt with igvm.c fix, keep this off. (vt.qemu.malloc_perturb=no)
malloc_perturb = no
reboot_method=
vm_secure_guest_type = snp
vm_sev_reduced_phys_bits = 1
# get_numeric() only accepts decimal; QMP snp-policy matches this (196608 == 0x30000)
vm_sev_policy = 196608
vm_mem_backend = memory-backend-memfd
kill_timeout=720
login_timeout=720
# Match SVSM coconut-qemu.igvm topology (same as launchguest_svsm): wrong smp/mem
# causes check_sev_features "unsupported sev_features" garbage / KVM EPERM.
smp = 8
shutdown_count=1
vcpu_cores = 8
vcpu_threads = 1
vcpu_sockets = 1
mem = 8G
kernel = build_home/usr/local/bzImage
only 24.04-server.x86_64
qemu_binary = build_home/usr/local/bin/qemu-system-x86_64
qemu_dst_binary = build_home/usr/local/bin/qemu-system-x86_64
qemu_img_binary = build_home/usr/local/bin/qemu-img
qemu_io_binary = build_home/usr/local/bin/qemu-io
enable_igvm = yes
igvm_path = build_home/usr/local/svsm/
igvm_filename = coconut-qemu.igvm
svsm_snp_attestation_measurement_tool = build_home/svsm/target/release/igvmmeasure
only virtio_scsi
no virtio_blk
kernel_params='root=/dev/sda1 rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node swiotlb=65536'

#Test
variants:
    - qemu_sanity:
       variants:
            - amd_svsm:
                auto_cpu_model = "no"
                cpu_model = EPYC-v4
                only io-github-autotest-qemu.amd_svsm
