include elves.cfg
# Tweaked for dellj
# Required Global Configurations
#cpu_model_flags = ",+svm,+x2apic"
avocado_vt_repo="https://github.com/bssrikanth/avocado-vt.git"
avocado_vt_repo_branch="upstream0824"
test_timeout=30000
avocado_guest_reinstall=yes
start_vm = yes
usb_controller = xhci
usb_type = qemu-xhci
usb_type_usb1 = qemu-xhci
# --- Platform ---
# --- Block devices ---
# --- Net devices ---
# --- Misc ---
virtio_dev_iommu_platform=on
virtio_dev_disable_legacy=on
bridge=virbr0
#machine_type_extra_params = "confidential-guest-support=sev0"
#extra_params=" -object sev-snp-guest,id=sev0,cbitpos=51,reduced-phys-bits=1,discard=both"
reboot_method=
vm_secure_guest_type = snp
vm_sev_cbitpos = 51
vm_sev_reduced_phys_bits = 1
vm_mem_backend = memory-backend-memfd
kill_timeout=720
login_timeout=720
only 26.04-server.x86_64
qemu_binary = build_home/usr/local/bin/qemu-system-x86_64
qemu_dst_binary = build_home/usr/local/bin/qemu-system-x86_64
qemu_img_binary = build_home/usr/local/bin/qemu-img
qemu_io_binary = build_home/usr/local/bin/qemu-io
kernel = build_home/usr/local/bzImage
main_vm = vm1
#Test
variants:
    - qemu_sanity:
       variants:
            - shutdown:
                only io-github-autotest-qemu.shutdown
                no multivm
                no virtioscsi
            - boot:
                only io-github-autotest-qemu.boot
                no virtioscsi
            - guest_attest:
                only io-github-autotest-qemu.guest_attest
                only OvmfX64.ovmfcode
                no virtioscsi
                only maxconfig
variants:
    - virtioblk:
       only virtio_blk
       no virtio_scsi
       kernel_params='root=/dev/vda1 rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node swiotlb=65536'
    - virtioscsi:
       kernel_params='root=/dev/sda1 rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node swiotlb=65536'
variants:
    - withkernelhash:
       #extra_params += ",kernel-hashes=on -no-reboot "
       #machine_type = "pc-q35-7.1"
       vm_sev_kernel_hashes = on
       only AmdSev
    - withoutkernelhash:
       #extra_params += " -no-reboot "
       vm_sev_kernel_hashes = off
       no AmdSev
variants:
    - maxconfig:
       shutdown_count=2
       vms = vm1
       smp = 255
       vcpu_cores = 255
       vcpu_threads = 1
       vcpu_sockets = 1
       mem = 245760M
    - multivm:
       smp = 255
       vcpu_cores = 255
       vcpu_threads = 1
       vcpu_sockets = 1
       vms = vm1 vm2 vm3 vm4 vm5 vm6 vm7 vm8 vm9 vm10
       shutdown_count=2
       sysprep_required = yes
       master_images_clone = image1
       clone_master = yes
       remove_image_image1 = yes
       mem = 24576M
    - min_config:
       vms = vm1
       smp = 1
       shutdown_count=10
       vcpu_cores = 1
       vcpu_threads = 1
       vcpu_sockets = 1
       mem = 2048M
variants:
    - OvmfX64:
       extra_params += " -bios build_home/usr/local/OvmfX64/OVMF.fd "
    - AmdSev:
       extra_params += " -bios build_home/usr/local/AmdSev/OVMF.fd "
