include elves.cfg
#cpu_model = "EPYC-v4"
#cpu_model = "host"
avocado_vt_repo="https://github.com/bssrikanth/avocado-vt.git"
avocado_vt_repo_branch="upstream0824"
test_timeout=24400
avocado_guest_reinstall=yes
start_vm = yes
usb_controller = xhci
usb_type = qemu-xhci
usb_type_usb1 = qemu-xhci
virtio_dev_iommu_platform=on
virtio_dev_disable_legacy=on
bridge=virbr0
main_vm = vm1
#extra_params="-object sev-guest,id=sev0,cbitpos=51,reduced-phys-bits=1,kernel-hashes=on "
#machine_type_extra_params = "confidential-guest-support=sev0,vmport=off"
#machine_type = "pc-q35-7.1"
vm_secure_guest_type = sev
vm_sev_cbitpos = 51
vm_sev_reduced_phys_bits = 1
vm_sev_policy = 3
vm_sev_kernel_hashes = on
kill_timeout=720
login_timeout=720
variants:
    - qemu_sanity:
       variants:
            - stress_boot_single:
                only io-github-autotest-qemu.boot
                vms = vm1
                no fullboot.virtioblk,kernelboot.virtioblk
            - stress_boot_multivm:
                only io-github-autotest-qemu.boot
                vms="vm1 vm2 vm3 vm4 vm5 vm6 vm7 vm8 vm9 vm10"
                sysprep_required = yes
                only min_config
                no fullboot,kernelboot.virtioblk
                master_images_clone = image1
                clone_master = yes
                remove_image_image1 = yes
                no with_host_phys
            - shutdown:
                only io-github-autotest-qemu.shutdown
                vms = vm1
                shutdown_count=100
                no fullboot,kernelboot.virtioblk
                no with_host_phys
            - reboot:
                only io-github-autotest-qemu.reboot
                vms = vm1
                reboot_count=100
                no fullboot,kernelboot.virtioblk
                no with_host_phys
variants:
    - kernelboot:
       kernel=build_home/usr/local/bzImage
       only 24.04-server.x86_64
       variants:
            - virtioblk:
                only virtio_blk
                no virtio_scsi
                kernel_params='root=/dev/vda rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node swiotlb=65536'
            - virtioscsi:
                kernel_params='root=/dev/sda rw console=ttyS0,115200n8 earlyprintk=ttyS0,115200 net.ifnames=0 biosdevname=0 movable_node swiotlb=65536'
    - fullboot:
       only 24.04-server.x86_64
       variants:
            - virtioblk:
                only virtio_blk
                no virtio_scsi
            - virtioscsi:
variants:
    - max_config:
       mem = 196608
       smp = 255
       vcpu_cores = 255
       vcpu_threads = 1
       vcpu_sockets = 1
    - min_config:
       mem = 23808
       smp = 1
       vcpu_cores = 1
       vcpu_threads = 1
       vcpu_sockets = 1
variants:
    - default:
    - with_host_phys:
       cpu_model_flags = ",host-phys-bits=true"
variants:
    - ovmf:
       extra_params += " -drive if=pflash,format=raw,unit=0,file=build_home/usr/local/AmdSev/OVMF.fd,readonly "
